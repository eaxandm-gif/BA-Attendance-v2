<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BA Attendance Admin</title>
<!-- BA Attendance UI 4.7.0 -->
<script src="admin-config.js?v=2.6.0"></script>
<script src="attendance-review.js?v=4.7.0"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<link rel="stylesheet" href="ui.css?v=4.7.5">
<script src="ui.js?v=4.7.0" defer></script>
</head>
<body class="admin-app">
<header><div><h1>BA Attendance · ผู้ดูแล</h1></div><button class="gray" onclick="logout()">ออกจากระบบ</button></header>
<div class="wrap">
<section id="loginBox" class="login">
  <div id="loginStatus"></div>
  <div class="grid">
    <div class="field"><label>Admin API Key</label><input id="adminKey" type="password" placeholder="กรอก ADMIN_API_KEY"></div>
    <div style="align-self:end"><button class="primary" onclick="login()">เข้าสู่ระบบ</button></div>
  </div>
</section>
<div id="app" class="hidden">
  <div id="status"></div>
  <div class="admin-navigation"><nav class="app-nav" id="mainNav" aria-label="เมนูผู้ดูแล"></nav><div class="tabs" id="tabs"></div></div>
  <section class="panel">
    <div class="toolbar">
      <button id="createCurrentBtn" class="primary" onclick="createCurrent()">เพิ่มรายการ</button>
      <button id="bulkScheduleBtn" class="hidden" onclick="toggleScheduleEditMode()">เลือกหลายคน/หลายวัน</button>
      <button onclick="refreshAll()">รีเฟรช</button>
      <select id="employeeStatusFilter" aria-label="สถานะพนักงาน" onchange="render()" style="max-width:200px"><option value="active">พนักงานที่ใช้งาน</option><option value="all">พนักงานทั้งหมด</option><option value="inactive">ปิดใช้งาน</option></select>
      <input id="search" placeholder="ค้นหา..." oninput="render()" style="max-width:300px">
      <input id="scheduleMonth" class="hidden" type="month" onchange="render()" style="max-width:180px">
      <input id="dailyDate" class="hidden" type="date" onchange="loadSummaryPeriod()" style="max-width:180px">
      <input id="monthlyMonth" class="hidden" type="month" onchange="loadMonthlyMatrixAttendance()" style="max-width:180px">
      <select id="monthlyView" class="hidden" onchange="render()" style="max-width:220px">
        <option value="matrix">ตารางทั้งเดือน (Matrix)</option>
        <option value="totals">สรุปยอดรวมแบบเดิม</option>
        <option value="employee">รายละเอียดพนักงานรายคน</option>
      </select>
      <select id="monthlyEmployee" class="hidden" onchange="render()" style="max-width:240px"><option value="">เลือกพนักงาน</option></select>
      <select id="monthlySupervisor" class="hidden" onchange="render()" style="max-width:200px"><option value="">Supervisor ทั้งหมด</option></select>
      <select id="monthlyRegion" class="hidden" onchange="render()" style="max-width:200px"><option value="">Region ทั้งหมด</option></select>
      <input id="attendanceFrom" class="hidden" type="date" onchange="loadAttendanceHistory()" title="Attendance ตั้งแต่วันที่" style="max-width:180px">
      <input id="attendanceTo" class="hidden" type="date" onchange="loadAttendanceHistory()" title="Attendance ถึงวันที่" style="max-width:180px">
      <button id="recalcSummaryBtn" class="hidden" onclick="recalculateCurrentSummary()">คำนวณใหม่</button>
      <button id="exportSummaryBtn" class="hidden" onclick="exportCurrentSummary()">ดาวน์โหลด Excel</button>
      <button id="sendMiddayReport" onclick="sendReport('MIDDAY')">ส่งรายงานรอบกลางวัน</button>
      <button id="sendEnddayReport" onclick="sendReport('ENDDAY')">ส่งรายงานรอบสิ้นวัน</button>
    </div>
    <div id="content"></div>
  </section>
</div>
</div>
<div id="scheduleSaveBar" class="hidden" style="position:fixed;left:0;right:0;bottom:0;z-index:12;background:#fff;border-top:1px solid #fbcfe8;box-shadow:0 -8px 24px #0001;padding:12px">
  <div style="max-width:1500px;margin:auto;display:flex;gap:10px;align-items:end;flex-wrap:wrap">
    <div class="field" style="min-width:180px;margin:0"><label>สถานะ</label>
      <select id="multiStatus" onchange="toggleMultiShift()">
        <option value="WORK">WORK</option>
        <option value="OFF">OFF</option>
        <option value="SICK_LEAVE">SICK_LEAVE</option>
        <option value="BUSINESS_LEAVE">BUSINESS_LEAVE</option>
        <option value="VACATION">VACATION</option>
      </select>
    </div>
    <div class="field" id="multiShiftWrap" style="min-width:180px;margin:0"><label>Shift</label><select id="multiShift"></select></div>
    <div class="field" style="width:140px;margin:0"><label>นาทีงาน</label><input id="multiMinutes" type="number" value="480"></div>
    <div class="field" style="min-width:220px;flex:1;margin:0"><label>หมายเหตุ</label><input id="multiNote"></div>
    <div><span id="selectedCount" class="badge">เลือก 0 ช่อง</span></div>
    <button class="gray" onclick="clearSelectedScheduleCells()">ล้างที่เลือก</button>
    <button class="primary" onclick="saveSelectedScheduleCells()">บันทึกทั้งหมด</button>
  </div>
</div>
<div id="modal" class="modal"><div class="sheet"><button class="modal-close" onclick="closeModal()">ปิด</button><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="actions"><button class="gray" onclick="closeModal()">ยกเลิก</button><button class="primary" id="saveBtn">บันทึก</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
let KEY='',DATA={},current='employees',selectedScheduleCells=new Set(),scheduleEditMode=false,attendanceLoading=false,monthlyMatrixLoading=false;
const tabs=[
 ['registrations','อนุมัติ BA ใหม่'],['employees','พนักงาน BA'],['supervisors','หัวหน้างาน'],['offices','สาขา'],['shifts','กะงาน'],
 ['attendance_requests','คำขอลงเวลา BA'],['schedules','ตารางงาน'],['attendance','รายการลงเวลา'],['leaves','การลา'],
 ['daily','สรุปรายวัน'],['monthly','สรุปรายเดือน'],['line_logs','LINE Logs'],['audits','Audit Logs']
];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function msg(t,bad=false){$('status').innerHTML=`<div class="status ${bad?'err':'ok'}">${esc(t)}</div>`;setTimeout(()=>{$('status').innerHTML=''},5000)}
async function api(action,payload={}){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),30000);
 try{
  const r=await fetch(BA_ADMIN_CONFIG.ADMIN_API_URL,{
   method:'POST',
   headers:{'Content-Type':'application/json','X-Admin-Key':KEY},
   body:JSON.stringify({action,payload}),
   signal:controller.signal
  });
  const text=await r.text();
  let j={};
  try{j=text?JSON.parse(text):{}}catch{throw new Error(`Admin API ตอบกลับไม่ถูกต้อง (${r.status})`)}
  if(!r.ok||j.success===false)throw new Error(j.message||`เกิดข้อผิดพลาด HTTP ${r.status}`);
  return j;
 }catch(e){
  if(e?.name==='AbortError')throw new Error('Admin API ไม่ตอบกลับภายใน 30 วินาที');
  throw e;
 }finally{clearTimeout(timeout)}
}
async function login(){
 KEY=$('adminKey').value.trim();
 const box=$('loginStatus');
 if(!KEY){box.innerHTML='<div class="status err">กรุณากรอก Admin API Key</div>';return}
 box.innerHTML='<div class="status">กำลังเชื่อมต่อ Admin API...</div>';
 try{
  const r=await api('bootstrap');
  DATA=r.data||{};BA_UI.registerRequests('leaves',DATA.leaves||[]);
  localStorage.setItem('ba_admin_key',KEY);
  $('loginBox').classList.add('hidden');
  $('app').classList.remove('hidden');
  buildTabs();
  render();
  api('attendance_requests',{status:'PENDING'}).then(r=>BA_UI.registerRequests('attendance_requests',[...(r.corrections||[]),...(r.gps||[])])).catch(()=>{});
 }catch(e){
  localStorage.removeItem('ba_admin_key');
  box.innerHTML=`<div class="status err">${esc(e.message)}</div>`;
  alert(e.message);
 }
}
function logout(){localStorage.removeItem('ba_admin_key');location.reload()}
async function refreshAll(){if(['daily','monthly'].includes(current))return loadSummaryPeriod();if(current==='attendance_requests')return loadAttendanceRequests();try{const r=await api('refresh');DATA=r.data;render();msg('อัปเดตข้อมูลแล้ว')}catch(e){msg(e.message,true)}}
async function loadAttendanceHistory(){
 if(current!=='attendance'||attendanceLoading)return;
 const start_date=$('attendanceFrom').value;
 const end_date=$('attendanceTo').value;
 if(!start_date||!end_date)return;
 if(start_date>end_date)return msg('วันที่เริ่มต้องไม่เกินวันที่สิ้นสุด',true);
 attendanceLoading=true;render();
 try{
   const result=await api('list_attendance',{start_date,end_date,limit:5000});
   const rows=result?.data?.attendance||result?.attendance||result?.data||result?.rows||[];
   if(!Array.isArray(rows))throw new Error('รูปแบบข้อมูล Attendance ไม่ถูกต้อง');
   DATA.attendance=rows;
   render();
 }catch(e){
   const from=new Date(`${start_date}T00:00:00+07:00`);
   const to=new Date(`${end_date}T23:59:59.999+07:00`);
   DATA.attendance=(DATA.attendance||[]).filter(x=>{const d=new Date(x.occurred_at);return d>=from&&d<=to});
   render();
   msg(`โหลด Attendance ย้อนหลังไม่สำเร็จ: ${e.message}`,true);
 }finally{attendanceLoading=false;render()}
}
let reportGeneration=0,reportReady='',reportError='',adminListData=null;
function restoreAdminListData(){
 if(adminListData){DATA=adminListData;adminListData=null;}
}
function selectedReportPeriod(){
 const month=$('monthlyMonth').value||bangkokDateKey(new Date()).slice(0,7);
 const day=$('dailyDate').value||bangkokDateKey(new Date());
 return current==='daily'?{start_date:day,end_date:day}:{start_date:`${month}-01`,end_date:`${month}-${String(daysInMonth(month)).padStart(2,'0')}`};
}
function reportKey(){return JSON.stringify(selectedReportPeriod())}
function reportGuard(){
 if(reportReady===reportKey()&&!monthlyMatrixLoading)return '';
 window.__currentSummaryRows=[];
 return `<div class="status">${esc(reportError||'กำลังโหลดข้อมูลสรุปให้ครบ กรุณารอสักครู่...')}</div>`;
}
async function loadSummaryPeriod(){
 if(!['daily','monthly'].includes(current))return;
 if(!adminListData)adminListData=DATA;
 const generation=++reportGeneration,period=selectedReportPeriod(),key=JSON.stringify(period);
 reportReady='';reportError='';monthlyMatrixLoading=true;render();
 try{
   const result=await api('report_data',period);
   if(generation!==reportGeneration||key!==reportKey())return;
   if(result.complete!==true||!['daily','schedules','leaves','attendance'].every(k=>Array.isArray(result.data?.[k])))throw new Error('ข้อมูลสรุปไม่ครบ');
   DATA={...DATA,...result.data};reportReady=key;
 }catch(e){if(generation===reportGeneration){reportError=`โหลดสรุปไม่สำเร็จ: ${e.message} กรุณากดรีเฟรช`;msg(reportError,true)}}
 finally{if(generation===reportGeneration){monthlyMatrixLoading=false;render()}}
}
async function loadMonthlyMatrixAttendance(){return loadSummaryPeriod()}
const navGroups=[['daily','ภาพรวมวันนี้','clock',['daily']],['employees','พนักงาน','people',['employees','supervisors','registrations','offices','shifts']],['schedules','ตารางงาน','calendar',['schedules']],['attendance_requests','ขอลงเวลา','request',['attendance_requests','attendance']],['leaves','ขอลา','leave',['leaves']],['monthly','รายงาน','report',['monthly','line_logs','audits']]];
function buildTabs(){
 const group=navGroups.find(g=>g[3].includes(current))||navGroups[0];
 $('mainNav').innerHTML=navGroups.map(g=>`<button ${['attendance_requests','leaves'].includes(g[0])?`data-request-category="${g[0]}"`:''} ${g===group?'aria-current="page"':''} onclick="switchTab('${g[0]}')">${window.BA_UI?.icon(g[2])||''}${g[1]}</button>`).join('');
 $('tabs').innerHTML=`<label class="visually-hidden" for="sectionSelect">เมนูย่อย</label><select id="sectionSelect" onchange="switchTab(this.value)">${tabs.filter(([id])=>group[3].includes(id)).map(([id,label])=>`<option value="${id}" ${id===current?'selected':''}>${label}</option>`).join('')}</select>`;
}

function switchTab(id){
 ++reportGeneration;monthlyMatrixLoading=false;
 if(!['daily','monthly'].includes(id))restoreAdminListData();
 current=id;buildTabs();render();
 if(id==='attendance')loadAttendanceHistory();
 if(id==='monthly'||id==='daily')loadSummaryPeriod();
}
function findName(list,id,key='id',label='display_name'){const x=(list||[]).find(v=>v[key]===id);return x?x[label]||x.office_name||x.supervisor_name||x.shift_name:id||'-'}
function employeeVisible(e){const status=$('employeeStatusFilter')?.value||'all';return status==='all'||(status==='active'?e.active!==false:e.active===false);}
function filterRows(rows){if(current==='employees')rows=rows.filter(employeeVisible);const q=$('search').value.trim().toLowerCase();return !q?rows:rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}
function tableColumnKind(header){
 if(/^\d{1,2}$/.test(String(header)))return 'day';
 if(/Event ลงเวลา/.test(header))return 'events';
 if(/เหตุผล|ข้อความ|ปัญหา|Error|ก่อน|หลัง/.test(header))return 'description';
 if(/ดำเนินการ|จัดการ/.test(header))return 'actions';
 if(/สาขา/.test(header))return 'office';
 if(/พนักงาน|ชื่อ/.test(header))return 'person';
 if(/สถานะ/.test(header))return 'status';
 if(/วันที่|เดือน/.test(header))return 'date';
 if(header==='เวลา'||header==='ประเภท / เวลา')return 'datetime';
 return 'short';
}
let detailSequence=0;
function table(headers,rows){
 const kinds=headers.map(tableColumnKind);
 const preferred=['รหัส','วันที่','เดือน','พนักงาน','ชื่อ','สถานะ','เข้า','ออก','OT','เกิน','ประเภท / เวลา','ประเภท','Event','เวลา','Action','สาขา','BA','WORK','OFF','SICK','HOL','INC'];
 const selected=new Set(preferred.filter(h=>headers.includes(h)).slice(0,6).map(h=>headers.indexOf(h)));
 if(!selected.size)selected.add(0);
 kinds.forEach((kind,i)=>{if(kind==='actions')selected.add(i)});
 const primary=headers.map((_,i)=>i).filter(i=>selected.has(i)),secondary=headers.map((_,i)=>i).filter(i=>!selected.has(i));
 const rendered=rows.map(row=>{
  const template=document.createElement('template');template.innerHTML=`<table><tbody>${row}</tbody></table>`;
  const cells=[...template.content.querySelectorAll('tr:first-child > td')];
  if(!cells.length)return '';
  const id=`row-detail-${++detailSequence}`;
  const value=i=>cells[i]?.innerHTML||'—';
  const main=primary.map(i=>`<td data-column="${kinds[i]}" data-label="${esc(headers[i])}"><div class="cell-value ${esc(cells[i]?.className||'')}">${value(i)}</div></td>`).join('');
  const details=secondary.length?`<td data-label="รายละเอียด"><button aria-expanded="false" aria-controls="${id}" onclick="toggleRowDetails(this)">ดูรายละเอียด</button></td>`:'';
  return `<tr>${main}${details}</tr>`+(secondary.length?`<tr id="${id}" class="record-detail" hidden><td colspan="${primary.length+1}"><dl class="record-fields">${secondary.map(i=>`<div><dt>${esc(headers[i])}</dt><dd>${value(i)}</dd></div>`).join('')}</dl></td></tr>`:'');
 }).join('');
 return `<div class="table-wrap compact-records"><table><thead><tr>${primary.map(i=>`<th>${esc(headers[i])}</th>`).join('')}${secondary.length?'<th>รายละเอียด</th>':''}</tr></thead><tbody>${rendered}</tbody></table></div>`;
}
function toggleRowDetails(button){const row=document.getElementById(button.getAttribute('aria-controls'));if(!row)return;row.hidden=!row.hidden;button.setAttribute('aria-expanded',String(!row.hidden));button.textContent=row.hidden?'ดูรายละเอียด':'ซ่อนรายละเอียด';}

function localDateISO(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function daysInMonth(month){const [y,m]=month.split('-').map(Number);return new Date(y,m,0).getDate()}
function renderScheduleOverview(){
 const month=$('scheduleMonth').value||new Date().toISOString().slice(0,7);
 const q=$('search').value.trim().toLowerCase();
 const employees=(DATA.employees||[]).filter(e=>e.active!==false && (!q||JSON.stringify(e).toLowerCase().includes(q)));
 const schedules=(DATA.schedules||[]).filter(s=>String(s.work_date||'').startsWith(month));
 const map=new Map(schedules.map(s=>[`${s.employee_id}:${s.work_date}`,s]));
 const total=daysInMonth(month);
 const headers=['พนักงาน',...Array.from({length:total},(_,i)=>String(i+1))];
 const rows=employees.map(emp=>{
   const cells=[];
   for(let day=1;day<=total;day++){
     const date=`${month}-${String(day).padStart(2,'0')}`;
     const key=`${emp.id}:${date}`;
     const s=map.get(key);
     let label='–', cls='empty', title='ยังไม่กำหนด';
     if(s){
       if(s.schedule_status==='WORK'){
         label=esc(s.shift_id||emp.default_shift_id||'WORK'); cls='work'; title=`${s.shift_id||emp.default_shift_id||'WORK'} · ${s.required_minutes||0} นาที`;
       }else if(s.schedule_status==='OFF'){
         label='OFF'; cls='off'; title='วันหยุด';
       }else{
         label=esc(s.schedule_status); cls='leave'; title=s.schedule_status;
       }
     }else if(emp.default_shift_id){
       label=esc(emp.default_shift_id); cls='default'; title=`Default Shift: ${emp.default_shift_id}`;
     }
     if(selectedScheduleCells.has(key)) cls+=' selected';
     const payload=s?JSON.stringify(s).replace(/'/g,'&#39;'):JSON.stringify({
       employee_id:emp.id,
       work_date:date,
       schedule_status:'WORK',
       shift_id:emp.default_shift_id||'',
       required_minutes:480
     });
     const click=scheduleEditMode
       ? `toggleScheduleCell('${emp.id}','${date}')`
       : `editRow(${payload})`;
     cells.push(`<td data-day="${day}"><div class="schedule-cell ${cls}" title="${esc(title)}" onclick="${click}">${label}</div></td>`);
   }
   return `<tr><td class="emp"><b>${esc(emp.employee_code)}</b><br>${esc(emp.display_name)}<br><span class="muted">Default: ${esc(emp.default_shift_id||'-')}</span></td>${cells.join('')}</tr>`;
 });
 $('content').innerHTML=`<div class="muted" style="margin-bottom:8px">${scheduleEditMode?'คลิกหลายช่องเพื่อเลือก แล้วกด “บันทึกทั้งหมด” ด้านล่าง':'คลิกช่องวันที่เพื่อแก้รายวัน หรือกด “เลือกหลายคน/หลายวัน” เพื่อแก้หลายช่องพร้อมกัน'}</div><div class="table-wrap schedule-grid-wrap ${scheduleEditMode?'editing':''}"><table class="schedule-grid"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function bangkokDateKey(value){
 const d=value instanceof Date?value:new Date(value);
 return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
function bangkokTime(value){
 const d=value instanceof Date?value:new Date(value);
 return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
}
function minutesOfDayFromHHMM(v){
 if(!v)return null;
 const [h,m]=String(v).slice(0,5).split(':').map(Number);
 return Number.isFinite(h)&&Number.isFinite(m)?h*60+m:null;
}
function eventMinutes(e){
 const t=bangkokTime(e.occurred_at);
 return minutesOfDayFromHHMM(t);
}
function durationBetween(start,end){
 if(start==null||end==null)return 0;
 return end>=start?end-start:(end+1440)-start;
}
function pairDuration(events,inType,outType){
 const sorted=events.filter(e=>e.event_type===inType||e.event_type===outType).sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at));
 let open=null,total=0;
 for(const e of sorted){
   const m=eventMinutes(e);
   if(e.event_type===inType&&open==null)open=m;
   if(e.event_type===outType&&open!=null){total+=durationBetween(open,m);open=null}
 }
 return total;
}
function workBoundaryTypes(mode){
 return mode==='MULTI_BRANCH'?{start:['DAY_IN'],end:['DAY_OUT']}:mode==='STOCK_REFILL'?{start:['WORK_IN','IN'],end:['WORK_OUT','OUT']}:{start:['IN'],end:['OUT']};
}
function summaryForEmployeeDate(emp,date){
 const summary=(DATA.daily||[]).find(s=>s.employee_id===emp.id&&s.work_date===date)||null;
 const schedule=(DATA.schedules||[]).find(s=>s.employee_id===emp.id&&s.work_date===date);
 const approvedLeave=(DATA.leaves||[]).find(l=>l.employee_id===emp.id&&l.leave_date===date&&l.status==='APPROVED');
 const events=(DATA.attendance||[]).filter(e=>e.employee_id===emp.id&&bangkokDateKey(e.occurred_at)===date).sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at));
 const boundary=workBoundaryTypes(emp.ba_mode);
 const workInTypes=new Set(boundary.start),workOutTypes=new Set(boundary.end);
 const firstEventIn=events.find(e=>workInTypes.has(e.event_type))||null;
 const lastEventOut=[...events].reverse().find(e=>workOutTypes.has(e.event_type))||null;
 const rawShiftId=summary?.shift_id||schedule?.shift_id||emp.default_shift_id||null;
 const normalizedShiftId=String(rawShiftId||'').replace(/^'([^']+)'::text$/, '$1');
 const shiftId=(DATA.shifts||[]).some(s=>s.id===normalizedShiftId)?normalizedShiftId:rawShiftId;
 const shift=(DATA.shifts||[]).find(s=>s.id===shiftId)||null;
 const today=bangkokDateKey(new Date());

 let status=approvedLeave?.leave_type||summary?.status||schedule?.schedule_status||'WORK';
 if(!summary&&!approvedLeave&&events.length)status=firstEventIn&&lastEventOut?'COMPLETED':'WORKING';
 if(status==='WORK'){
   if(date<today)status='ABSENT';
   else if(date===today)status='NOT_STARTED';
   else status='FUTURE';
 }

 const offices=Array.isArray(summary?.branch_names)
   ?summary.branch_names.join(', ')
   :(summary?.branch_names||[...new Set(events.map(e=>e.offices?.office_name).filter(Boolean))].join(', '));
 // A summary's null boundary is meaningful: the employee has not checked out.
 const firstInValue=summary?summary.first_in:(firstEventIn?.occurred_at||null);
 const lastOutValue=summary?summary.last_out:(lastEventOut?.occurred_at||null);
 const fallbackBreak=pairDuration(events,'BREAK_OUT','BREAK_IN');
 const fallbackRefill=pairDuration(events,'REFILL_IN','REFILL_OUT');
 const required=Number(summary?.required_minutes??0);
 const credited=Number(summary?.credited_minutes??summary?.work_minutes??0);
 const shiftStartMinutes=minutesOfDayFromHHMM(summary?.shift_start||shift?.start_time);
 const fallbackLate=firstEventIn&&shiftStartMinutes!=null?Math.max(0,eventMinutes(firstEventIn)-shiftStartMinutes-Number(shift?.grace_minutes||0)):0;
 const fallbackShort=status==='COMPLETED'&&required>credited?required-credited:0;
 const fallbackOver=0; // Missing summaries must never manufacture OT.

 return {
   work_date:date,
   employee_id:emp.id,
   employee_code:emp.employee_code,
   display_name:emp.display_name,
   supervisor_name:emp.supervisors?.supervisor_name||'',
   ba_mode:emp.ba_mode||'',

   shift_start:summary?.shift_start?String(summary.shift_start).slice(0,5):(shift?.start_time?String(shift.start_time).slice(0,5):''),
   shift_end:summary?.shift_end?String(summary.shift_end).slice(0,5):(shift?.end_time?String(shift.end_time).slice(0,5):''),
   first_in:firstInValue?bangkokTime(firstInValue):'',
   last_out:lastOutValue?bangkokTime(lastOutValue):'',
   late_minutes:Number(summary?.late_minutes??(summary?0:fallbackLate)),
   credited_minutes:credited,
   break_minutes:Number(summary?.break_minutes??(summary?0:fallbackBreak)),
   refill_minutes:Number(summary?.refill_minutes??(summary?0:fallbackRefill)),
   required_minutes:required,
   short_minutes:Number(summary?.short_minutes??(summary?0:fallbackShort)),
   over_minutes:Number(summary?.over_minutes??(summary?0:fallbackOver)),
   net_minutes:Number(summary?.net_minutes??0),
   offices,
   issue:summary?.issue||(!summary&&events.length?'รอคำนวณสรุปรายวัน':''),
   has_events:Boolean(summary?.first_in||summary?.last_out||events.length)
 };
}

function relevantDatesForEmployeeMonth(emp,month){
 const set=new Set();
 (DATA.daily||[]).filter(s=>s.employee_id===emp.id&&String(s.work_date||'').startsWith(month)).forEach(s=>set.add(s.work_date));
 (DATA.schedules||[]).filter(s=>s.employee_id===emp.id&&String(s.work_date||'').startsWith(month)).forEach(s=>set.add(s.work_date));
 (DATA.leaves||[]).filter(l=>l.employee_id===emp.id&&String(l.leave_date||'').startsWith(month)&&l.status==='APPROVED').forEach(l=>set.add(l.leave_date));
 (DATA.attendance||[]).filter(e=>e.employee_id===emp.id&&bangkokDateKey(e.occurred_at).startsWith(month)).forEach(e=>set.add(bangkokDateKey(e.occurred_at)));
 return [...set].sort();
}
function matrixStatusForDate(emp,date,eventMap){
 const today=bangkokDateKey(new Date());
 if(date>=today)return '';
 const leave=(DATA.leaves||[]).find(l=>l.employee_id===emp.id&&l.leave_date===date&&l.status==='APPROVED');
 if(leave)return leave.leave_type==='SICK_LEAVE'?'SICK':'HOL';
 const schedule=(DATA.schedules||[]).find(s=>s.employee_id===emp.id&&s.work_date===date);
 if(schedule?.schedule_status==='SICK_LEAVE')return 'SICK';
 if(['BUSINESS_LEAVE','VACATION'].includes(schedule?.schedule_status))return 'HOL';
 if(schedule?.schedule_status==='OFF')return 'OFF';
 const summary=(DATA.daily||[]).find(s=>s.employee_id===emp.id&&s.work_date===date);
 if(summary){
   const hasIn=Boolean(summary.first_in),hasOut=Boolean(summary.last_out);
   if((hasIn&&!hasOut)||(!hasIn&&hasOut)||summary.issue)return 'INC';
   if(['COMPLETED','WORKING'].includes(summary.status)||hasIn||hasOut)return 'WORK';
   if(summary.status==='SICK_LEAVE')return 'SICK';
   if(['BUSINESS_LEAVE','VACATION'].includes(summary.status))return 'HOL';
   if(summary.status==='OFF')return 'OFF';
 }
 const events=eventMap.get(`${emp.id}:${date}`)||[];
 if(events.length){
   const boundary=workBoundaryTypes(emp.ba_mode);
   const startTypes=new Set(boundary.start),endTypes=new Set(boundary.end);
   const hasStart=events.some(e=>startTypes.has(e.event_type));
   const hasEnd=events.some(e=>endTypes.has(e.event_type));
   return hasStart&&hasEnd?'WORK':'INC';
 }
 return 'OFF';
}
function buildMonthlyMatrix(month){
 const supervisor=$('monthlySupervisor').value;
 const region=$('monthlyRegion').value;
 const total=daysInMonth(month);
 const eventMap=new Map();
 for(const event of (DATA.attendance||[])){
   const date=bangkokDateKey(event.occurred_at);
   if(!date.startsWith(month))continue;
   const key=`${event.employee_id}:${date}`;
   if(!eventMap.has(key))eventMap.set(key,[]);
   eventMap.get(key).push(event);
 }
 return (DATA.employees||[]).filter(employeeVisible).filter(emp=>{
   if(emp.active===false&&!relevantDatesForEmployeeMonth(emp,month).length)return false;
   if(supervisor&&emp.supervisor_id!==supervisor)return false;
   if(region&&emp.offices?.region!==region)return false;
   return true;
 }).map(emp=>{
   const row={employee_code:emp.employee_code,display_name:emp.display_name,supervisor_name:emp.supervisors?.supervisor_name||'',region:emp.offices?.region||''};
   const counts={WORK:0,OFF:0,SICK:0,HOL:0,INC:0};
   for(let day=1;day<=total;day++){
     const date=`${month}-${String(day).padStart(2,'0')}`;
     const status=matrixStatusForDate(emp,date,eventMap);
     row[`day_${day}`]=status;
     if(status)counts[status]++;
   }
   return {...row,...counts};
 });
}

 if(current==='attendance'){const d=x.occurred_at?new Date(x.occurred_at):new Date();html=`<div class="grid">${select('employee_id','พนักงาน',opts(DATA.employees,x.employee_id,'display_name'))}${field('date','วันที่',x.occurred_at?d.toISOString().slice(0,10):'','date')}${field('time','เวลา',x.occurred_at?d.toLocaleTimeString('en-GB',{timeZone:'Asia/Bangkok'}).slice(0,5):'','time')}${select('event_type','Event',['IN','OUT','BREAK_OUT','BREAK_IN','DAY_IN','DAY_OUT','BRANCH_IN','BRANCH_OUT','WORK_IN','WORK_OUT','REFILL_IN','REFILL_OUT'].map(v=>`<option ${v===x.event_type?'selected':''}>${v}</option>`).join(''))}${select('office_id','สาขา',opts(DATA.offices,x.office_id,'office_name'))}${reasonField()}</div>`}
 if(current==='leaves')html=`<div class="grid">${select('employee_id','พนักงาน',opts(DATA.employees,x.employee_id,'display_name'))}${field('leave_date','วันที่ลา',x.leave_date,'date')}${select('leave_type','ประเภท',['SICK_LEAVE','BUSINESS_LEAVE','VACATION'].map(v=>`<option ${v===x.leave_type?'selected':''}>${v}</option>`).join(''))}${field('leave_reason','เหตุผลการลา',x.reason)}${select('status','สถานะ',['PENDING','APPROVED','REJECTED'].map(v=>`<option ${v===x.status?'selected':''}>${v}</option>`).join(''))}${select('reviewed_by','ผู้อนุมัติ',opts(DATA.supervisors,x.reviewed_by,'supervisor_name'))}${field('reviewer_note','หมายเหตุผู้อนุมัติ',x.reviewer_note)}${reasonField()}</div>`;
 $('modalBody').innerHTML=html;
 $('saveBtn').onclick=()=>saveRow(x.id||null);
}
function val(id){const e=$(id);return e?e.value:null}
async function saveRow(id){
 try{
  let p={id,reason:val('reason')};
  document.querySelectorAll('#modalBody input,#modalBody select,#modalBody textarea').forEach(e=>{if(e.id&&e.id!=='reason')p[e.id]=e.value});
  if('active' in p)p.active=p.active==='true';
  const map={employees:'save_employee',supervisors:'save_supervisor',offices:'save_office',shifts:'save_shift',schedules:'save_schedule',attendance:'save_attendance',leaves:'save_leave'};
  const result=await api(map[current],p);
  closeModal();
  await refreshAll();
  msg(result?.message||'บันทึกแล้ว');
 }catch(e){
  const message=e?.message||'บันทึกไม่สำเร็จ';
  msg(message,true);
  alert(message);
 }
}
async function deleteRow(x){
 if(!confirm('ยืนยันลบรายการนี้?'))return;
 const reason=prompt('เหตุผลการลบ');if(!reason)return;
 const map={employees:'delete_employee',supervisors:'delete_supervisor',offices:'delete_office',shifts:'delete_shift',schedules:'delete_schedule',attendance:'delete_attendance',leaves:'delete_leave'};
 try{await api(map[current],{id:x.id,reason});await refreshAll();msg('ลบแล้ว')}catch(e){msg(e.message,true)}
}
async function reviewRegistration(x,decision){
 try{
  const reason=prompt(decision==='APPROVED'?'เหตุผล/หมายเหตุการอนุมัติ':'เหตุผลที่ไม่อนุมัติ');
  if(!reason)return;
  const p={id:x.id,decision,reason};
  if(decision==='APPROVED'){
    const supOpts=(DATA.supervisors||[]).map(s=>`${s.id} = ${s.supervisor_name}`).join('\n');
    const officeOpts=(DATA.offices||[]).filter(o=>o.active!==false).map(o=>`${o.id} = ${o.office_name}`).join('\n');
    const shiftOpts=(DATA.shifts||[]).filter(s=>s.active!==false).map(s=>`${s.id} = ${s.shift_name||s.id}`).join('\n');
    p.supervisor_id=prompt(`Supervisor ID\n${supOpts}`,x.requested_supervisor_id||'')||x.requested_supervisor_id;
    p.assigned_office_id=prompt(`Office ID\n${officeOpts}`,(DATA.offices||[]).find(o=>o.active!==false)?.id||'');
    p.default_shift_id=prompt(`Shift ID\n${shiftOpts}`,(DATA.shifts||[]).find(s=>s.active!==false)?.id||'');
    p.ba_mode=prompt('ประเภท BA: FIXED_BRANCH / MULTI_BRANCH / STOCK_REFILL','FIXED_BRANCH')||'FIXED_BRANCH';
    if(!p.assigned_office_id||!p.default_shift_id)return alert('ต้องเลือก Office และ Shift');
  }
  await api('review_ba_registration',p);
  await refreshAll();
  msg(decision==='APPROVED'?'อนุมัติ BA ใหม่แล้ว':'ปฏิเสธคำขอแล้ว');
 }catch(e){msg(e.message,true);alert(e.message)}
}

async function sendReport(type){
 const date=prompt('วันที่รายงาน YYYY-MM-DD',new Date().toISOString().slice(0,10));if(!date)return;
 const reason=prompt('เหตุผลการส่งรายงาน','ส่งจาก Admin');
 try{const r=await api('send_line_report',{type,date,reason});msg(`ส่งรายงานสำเร็จ ${r.result.sent||0} Supervisor`);await refreshAll()}catch(e){msg(e.message,true)}
}
function toggleScheduleEditMode(){
 scheduleEditMode=!scheduleEditMode;
 if(!scheduleEditMode)selectedScheduleCells.clear();
 $('bulkScheduleBtn').textContent=scheduleEditMode?'ยกเลิกโหมดเลือก':'เลือกหลายคน/หลายวัน';
 const shiftOptions=`<option value="">-</option>`+(DATA.shifts||[]).filter(s=>s.active!==false).map(s=>`<option value="${s.id}">${esc(s.shift_name||s.id)}</option>`).join('');
 $('multiShift').innerHTML=shiftOptions;
 $('scheduleSaveBar').classList.toggle('hidden',!scheduleEditMode);
 updateSelectedCount();
 renderScheduleOverview();
}
function toggleScheduleCell(employeeId,workDate){
 const key=`${employeeId}:${workDate}`;
 if(selectedScheduleCells.has(key))selectedScheduleCells.delete(key);else selectedScheduleCells.add(key);
 updateSelectedCount();
 renderScheduleOverview();
}
function clearSelectedScheduleCells(){
 selectedScheduleCells.clear();
 updateSelectedCount();
 renderScheduleOverview();
}
function updateSelectedCount(){
 $('selectedCount').textContent=`เลือก ${selectedScheduleCells.size} ช่อง`;
}
function toggleMultiShift(){
 $('multiShiftWrap').classList.toggle('hidden',$('multiStatus').value!=='WORK');
}
async function saveSelectedScheduleCells(){
 try{
   if(!selectedScheduleCells.size)throw new Error('กรุณาเลือกอย่างน้อย 1 ช่อง');
   const reason=prompt('เหตุผลการเปลี่ยน Shift/ตารางงานทั้งหมด');
   if(!reason)return;
   const cells=Array.from(selectedScheduleCells).map(k=>{
     const [employee_id,work_date]=k.split(':');
     return {employee_id,work_date};
   });
   const payload={
     cells,
     schedule_status:$('multiStatus').value,
     shift_id:$('multiStatus').value==='WORK' ? $('multiShift').value : null,
     required_minutes:Number($('multiMinutes').value||480),
     note:$('multiNote').value,
     reason
   };
   const r=await api('bulk_save_schedule_cells',payload);
   selectedScheduleCells.clear();
   scheduleEditMode=false;
   $('bulkScheduleBtn').textContent='เลือกหลายคน/หลายวัน';
   $('scheduleSaveBar').classList.add('hidden');
   await refreshAll();
   msg(`บันทึกสำเร็จ ${r.affected||0} ช่อง`);
 }catch(e){msg(e.message,true)}
}
function openBulkSchedule(){
 const month=$('scheduleMonth').value||new Date().toISOString().slice(0,7);
 const start=`${month}-01`;
 const end=`${month}-${String(daysInMonth(month)).padStart(2,'0')}`;
 const employeeOptions=(DATA.employees||[]).filter(e=>e.active!==false).map(e=>`<option value="${e.id}">${esc(e.employee_code)} · ${esc(e.display_name)}</option>`).join('');
 const shiftOptions=`<option value="">-</option>`+(DATA.shifts||[]).filter(s=>s.active!==false).map(s=>`<option value="${s.id}">${esc(s.shift_name||s.id)}</option>`).join('');
 $('modalTitle').textContent='จัด Shift แบบช่วงวัน';
 $('modalBody').innerHTML=`
 <div class="grid">
   <div class="field" style="grid-column:1/-1">
     <label>พนักงาน (เลือกได้หลายคน)</label>
     <select id="bulkEmployees" multiple size="8">${employeeOptions}</select>
   </div>
   <div class="field"><label>วันที่เริ่ม</label><input id="bulkStart" type="date" value="${start}"></div>
   <div class="field"><label>วันที่สิ้นสุด</label><input id="bulkEnd" type="date" value="${end}"></div>
   <div class="field"><label>สถานะ</label>
     <select id="bulkStatus" onchange="toggleBulkShift()">
       <option value="WORK">WORK</option>
       <option value="OFF">OFF</option>
       <option value="SICK_LEAVE">SICK_LEAVE</option>
       <option value="BUSINESS_LEAVE">BUSINESS_LEAVE</option>
       <option value="VACATION">VACATION</option>
     </select>
   </div>
   <div class="field" id="bulkShiftWrap"><label>Shift</label><select id="bulkShift">${shiftOptions}</select></div>
   <div class="field"><label>นาทีงาน</label><input id="bulkMinutes" type="number" value="480"></div>
   <div class="field"><label>หมายเหตุ</label><input id="bulkNote"></div>
   <div class="field" style="grid-column:1/-1">
     <label>เลือกวันในสัปดาห์</label>
     <div style="display:flex;gap:10px;flex-wrap:wrap">
       ${[['1','จ'],['2','อ'],['3','พ'],['4','พฤ'],['5','ศ'],['6','ส'],['0','อา']].map(([v,l])=>`<label><input class="bulkWeekday" type="checkbox" value="${v}" checked style="width:auto"> ${l}</label>`).join('')}
     </div>
   </div>
 </div>`;
 $('saveBtn').onclick=saveBulkSchedule;
 $('modal').classList.add('show');
}
function toggleBulkShift(){
 const isWork=$('bulkStatus').value==='WORK';
 $('bulkShiftWrap').classList.toggle('hidden',!isWork);
}
async function saveBulkSchedule(){
 try{
   const employee_ids=Array.from($('bulkEmployees').selectedOptions).map(o=>o.value);
   if(!employee_ids.length)throw new Error('กรุณาเลือกพนักงานอย่างน้อย 1 คน');
   const reason=prompt('เหตุผลการเปลี่ยน Shift หลายวัน');
   if(!reason)return;
   const weekdays=Array.from(document.querySelectorAll('.bulkWeekday:checked')).map(x=>Number(x.value));
   const payload={
     employee_ids,
     start_date:$('bulkStart').value,
     end_date:$('bulkEnd').value,
     schedule_status:$('bulkStatus').value,
     shift_id:$('bulkStatus').value==='WORK' ? $('bulkShift').value : null,
     required_minutes:Number($('bulkMinutes').value||480),
     note:$('bulkNote').value,
     weekdays,
     reason
   };
   const r=await api('bulk_save_schedules',payload);
   closeModal();
   await refreshAll();
   msg(`บันทึกตารางงานแล้ว ${r.affected||0} รายการ`);
 }catch(e){msg(e.message,true)}
}
function closeModal(){$('modal').classList.remove('show')}
window.addEventListener('load',()=>{const k=localStorage.getItem('ba_admin_key');if(k){$('adminKey').value=k;login()}});
</script>
